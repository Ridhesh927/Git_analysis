# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Neon DB (PostgreSQL) ──────────────────────────────────────────────────────
# Replace the placeholder below with your actual Neon connection string.
# Get it from: https://console.neon.tech → Your project → Connection Details → JDBC tab
# The URL already includes user & password as query params — just paste the whole thing:
spring.datasource.url=${NEON_DATABASE_URL:jdbc:postgresql://localhost:5432/github_analyzer}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── GitHub API Token ──────────────────────────────────────────────────────────
# Get your token from: https://github.com/settings/tokens
# Check "public_repo" scope (or "repo" for private repos)
github.token=${GITHUB_TOKEN:}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Frontend dev server URL (Vite runs on 5173 by default)
cors.allowed-origins=http://localhost:5173

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.analyzer=INFO
logging.level.org.springframework.web=WARN
